kind = "web"
previewPath = "/"
title = "ImageToText.fun - OCR Platform"
version = "1.0.0"
id = "artifacts/imagetotext"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24711

[services.development]
run = "pnpm --filter @workspace/imagetotext run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/imagetotext", "run", "build" ]
publicDir = "artifacts/imagetotext/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24711"
BASE_PATH = "/"
